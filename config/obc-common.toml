#Toggle on breeding buff (Bottle Cap affects main IVs)
breedingBuff = false

[minecraft-treasure]
	#This is to modify the drop chance of the bottle caps in the Minecraft treasure loot pool
	#Chance of dropping a silver bottle cap
	# Default: 0.27
	# Range: 0.0 ~ 1.0
	silverBottleCapMinecraft = 0.27
	#Chance of dropping a gold bottle cap
	# Default: 0.07
	# Range: 0.0 ~ 1.0
	goldBottleCapMinecraft = 0.07

[cobblemon-treasure]
	#This is to modify the drop chance of the bottle caps in the Cobblemon Pokerod treasure loot pool
	#Chance of dropping a silver bottle cap
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	silverBottleCapCobblemon = 0.3
	#Chance of dropping a gold bottle cap
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	goldBottleCapCobblemon = 0.1
