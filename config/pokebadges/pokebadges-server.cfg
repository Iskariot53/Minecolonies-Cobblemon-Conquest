// PokeBadges server config
// lock_badges_in_badge_box: true or false
// If true, players cannot remove badges once they are stored in the badge box
// This keeps the badge box as the canonical backup source for /pokebadges backup
lock_badges_in_badge_box=true

// strict_badge_mode: true or false
// If true, badges are treated as permanent trophy progress and cannot be withdrawn from the badge box
strict_badge_mode=false

// backup_command_cooldown_seconds: whole number >= 0
// Cooldown applied to the player command /pokebadges backup to avoid spam
backup_command_cooldown_seconds=30

// unova_badge_set: black_white_1 or black_white_2
// Controls which 8 Unova badges are active and displayed in the Badge Box
unova_badge_set=black_white_2

// hide_disabled_unova_badges_in_creative_tab: true or false
// If false, disabled Unova badges remain visible as items but cannot be used as active progress
hide_disabled_unova_badges_in_creative_tab=false

// external_open_requires_badge_box: true or false
// If false, /pokebadges open and integration APIs can open the interface without the physical item
external_open_requires_badge_box=false
